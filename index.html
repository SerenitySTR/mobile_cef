<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/CSS/styles/registration.css">
    <link rel="stylesheet" href="./assets/CSS/styles/authorization.css">
    <link rel="stylesheet" href="./assets/CSS/styles/error.css">
    <link rel="stylesheet" href="./assets/CSS/styles/hud.css">
</head>

<body>
    <section id="authorization">
    <div class="authorization-background"></div>

    <div class="authorization-container">
        <img class="authorization-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="authorization-title">
            <span></span>
            <h1>Авторизація</h1>
            <span></span>
        </div>

        <div class="authorization-field">
            <img src="./assets/CSS/Images/Registration/icon-user.svg" alt="">
            <input type="text" id="authorization-username" placeholder="Ім'я користувача" readonly>
        </div>

        <div class="authorization-field">
            <img src="./assets/CSS/Images/Registration/icon-lock.svg" alt="">
            <input type="password" id="authorization-password" placeholder="Введіть пароль" autocomplete="off">

            <button class="authorization-password-eye" type="button">
                <img src="./assets/CSS/Images/Registration/icon-eye.svg" alt="">
            </button>
        </div>

        <button id="authorization-button" type="button">Увійти</button>
    </div>
</section>       
    <section id="registration">
    <div class="registration-background"></div>

    <div class="registration-container registration-step active" id="registration-step-1">
        <img class="registration-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="registration-title">
            <span></span>
            <h1>Реєстрація</h1>
            <span></span>
        </div>

        <div class="registration-field">
            <img src="./assets/CSS/Images/Registration/icon-user.svg" alt="">
            <input type="text" id="username" placeholder="Ім'я персонажа" readonly>
        </div>

        <div class="registration-field">
            <img src="./assets/CSS/Images/Registration/icon-mail.svg" alt="">
            <input type="email" id="email" placeholder="Введіть E-mail" autocomplete="off">
        </div>

        <div class="registration-field">
            <img src="./assets/CSS/Images/Registration/icon-lock.svg" alt="">
            <input type="password" id="password" placeholder="Введіть пароль" autocomplete="off">

            <button class="password-eye" type="button" data-target="password">
                <img src="./assets/CSS/Images/Registration/icon-eye.svg" alt="">
            </button>
        </div>

        <div class="registration-field">
            <img src="./assets/CSS/Images/Registration/icon-lock.svg" alt="">
            <input type="password" id="password-repeat" placeholder="Повторіть пароль" autocomplete="off">

            <button class="password-eye" type="button" data-target="password-repeat">
                <img src="./assets/CSS/Images/Registration/icon-eye.svg" alt="">
            </button>
        </div>

        <button id="registration-next-button" type="button">Продовжити</button>
    </div>

    <div class="registration-container registration-step" id="registration-step-2">
        <img class="registration-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="registration-title">
            <span></span>
            <h1>Персонаж</h1>
            <span></span>
        </div>

        <p class="registration-description">Оберіть стать та вкажіть вік персонажа</p>

        <div class="gender-selector">
            <button class="gender-button" type="button" data-gender="male">
                <span class="gender-icon">♂</span>
                <span>Чоловіча</span>
            </button>

            <button class="gender-button" type="button" data-gender="female">
                <span class="gender-icon">♀</span>
                <span>Жіноча</span>
            </button>
        </div>

        <div class="age-container">
            <p class="age-title">Вік персонажа</p>

            <div class="age-selector">
                <button id="age-minus" type="button">−</button>
                <input type="number" id="age" min="18" max="70" value="18" inputmode="numeric">
                <button id="age-plus" type="button">+</button>
            </div>

            <p class="age-description">Допустимий вік: від 18 до 70 років</p>
        </div>

        <div class="registration-buttons">
            <button id="registration-back-button" type="button">Назад</button>
            <button id="registration-button" type="button">Зареєструватися</button>
        </div>
    </div>
</section>
    <section id="error-screen">
    <div class="error-background"></div>

    <div class="error-container">
        <div class="error-icon">!</div>

        <h1 id="error-title">Помилка</h1>

        <p id="error-message">
            
        </p>

        <button id="error-close-button" type="button">
            Закрити
        </button>
    </div>
</section>
    <section id="hud">
    <div class="hud-container">
        <div class="hud-top">
            <img class="hud-logo" src="./assets/CSS/Images/Hud/logo.svg" alt="">

            <div class="hud-money">
                <img src="./assets/CSS/Images/Hud/icon-money.svg" alt="">
                <span id="hud-money-value">$25 000</span>
            </div>
        </div>

        <div class="hud-stats">
            <div class="hud-stat hud-health">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-health.svg" alt="">

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-health-bar"></div>
                </div>

                <span id="hud-health-value">100</span>
            </div>

            <div class="hud-stat hud-armour">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-armour.svg" alt="">

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-armour-bar"></div>
                </div>

                <span id="hud-armour-value">60</span>
            </div>

            <div class="hud-stat hud-hunger">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-hunger.svg" alt="">

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-hunger-bar"></div>
                </div>

                <span id="hud-hunger-value">75</span>
            </div>
        </div>
    </div>
</section>

    <script src="./assets/JavaScript/cef-wrapper.js"></script>
    <script src="./assets/JavaScript/registration.js"></script>
    <script src="./assets/JavaScript/authorization.js"></script>
    <script src="./assets/JavaScript/hud.js"></script>
    <script src="./assets/JavaScript/error.js"></script>
</body>
</html>
