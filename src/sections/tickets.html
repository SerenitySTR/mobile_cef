<section id="tickets" aria-hidden="true">
    <div class="tickets-panel">
        <header class="tickets-header">
            <div><span class="tickets-kicker">ПІДТРИМКА</span><h1>Система тікетів</h1><p>Звернення до адміністрації сервера</p></div>
            <div class="tickets-header-actions"><button id="tickets-create" class="tickets-primary">+ Створити тікет</button><button id="tickets-close" class="tickets-icon">×</button></div>
        </header>
        <div class="tickets-layout">
            <aside class="tickets-sidebar">
                <div class="tickets-tabs"><button data-filter="all" class="active">Всі</button><button data-filter="open">Відкриті</button><button data-filter="closed">Закриті</button></div>
                <div id="tickets-list" class="tickets-list"></div>
            </aside>
            <main class="tickets-content">
                <div id="tickets-empty" class="tickets-empty"><strong>Оберіть тікет</strong><span>або створіть нове звернення</span></div>
                <div id="tickets-thread" class="tickets-thread hidden">
                    <div class="tickets-thread-head"><div><h2 id="tickets-title"></h2><span id="tickets-meta"></span></div><span id="tickets-status" class="tickets-status"></span></div>
                    <div id="tickets-messages" class="tickets-messages"></div>
                    <div id="tickets-reply" class="tickets-reply-wrapper">
                        <div id="tickets-quick-replies" class="tickets-quick-replies hidden">
                            <button data-reply="Вітаю! Чим можу допомогти?">Вітання</button>
                            <button data-reply="Очікуйте, будь ласка, перевіряю інформацію.">Перевіряю</button>
                            <button data-reply="Уточніть, будь ласка, детальніше вашу проблему.">Уточнити</button>
                            <button data-reply="Спробуйте, будь ласка, перезайти на сервер.">Перезайти</button>
                            <button data-reply="Інформацію передано адміністрації. Очікуйте, будь ласка.">Передано</button>
                            <button data-reply="Проблему вирішено. Приємної гри!">Вирішено</button>
                        </div>
                        <div class="tickets-reply">
                            <button id="tickets-quick-toggle" class="tickets-quick-toggle hidden">Швидкі відповіді</button>
                            <input id="tickets-message" maxlength="500" placeholder="Написати повідомлення...">
                            <button id="tickets-send">Надіслати</button>
                        </div>
                    </div>
                    <button id="tickets-finish" class="tickets-finish">Закрити тікет</button>
                </div>
            </main>
        </div>
    </div>
    <div id="tickets-create-modal" class="tickets-modal hidden">
        <div class="tickets-modal-card"><h2>Нове звернення</h2><input id="tickets-new-title" maxlength="60" placeholder="Тема звернення"><textarea id="tickets-new-message" maxlength="500" placeholder="Опишіть проблему або питання"></textarea><div><button id="tickets-create-cancel">Скасувати</button><button id="tickets-create-submit" class="tickets-primary">Створити</button></div></div>
    </div>
</section>
