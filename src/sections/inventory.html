<section id="inventory">
    <div class="inventory-panel">
        <header class="inventory-header">
            <div class="inventory-title-wrap">
                <img class="inventory-logo" src="./assets/CSS/Images/brand-logo.png" alt="Antares RolePlay">
                <div>
                    <span class="inventory-kicker">ПЕРСОНАЛЬНЕ СХОВИЩЕ</span>
                    <h1>Інвентар</h1>
                </div>
            </div>

            <div class="inventory-header-actions">
                <span class="inventory-items-count" id="inventory-items-count">0 предметів</span>
                <button class="inventory-close" id="inventory-close" type="button" aria-label="Закрити інвентар">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12"></path>
                        <path d="M18 6 6 18"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="inventory-content">
            <main class="inventory-items">
                <div class="inventory-section-head">
                    <div>
                        <span>ПРЕДМЕТИ</span>
                        <p>Оберіть предмет, щоб переглянути його властивості.</p>
                    </div>
                </div>

                <div class="inventory-grid" id="inventory-grid"></div>

                <div class="inventory-empty" id="inventory-empty">
                    <div class="inventory-empty-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 8V6a5 5 0 0 1 10 0v2"></path>
                            <rect x="4" y="8" width="16" height="13" rx="3"></rect>
                            <path d="M8 12h8"></path>
                        </svg>
                    </div>
                    <strong>Інвентар порожній</strong>
                    <span>Отримані предмети з'являться тут.</span>
                </div>
            </main>

            <aside class="inventory-details" id="inventory-details">
                <div class="inventory-preview">
                    <div class="inventory-preview-glow"></div>
                    <img id="inventory-details-image" alt="">
                    <span class="inventory-preview-count" id="inventory-details-count">x0</span>
                </div>

                <div class="inventory-details-info">
                    <span class="inventory-details-label">ОБРАНИЙ ПРЕДМЕТ</span>
                    <h2 id="inventory-details-title">Оберіть предмет</h2>
                    <p id="inventory-details-description">Оберіть предмет ліворуч, щоб побачити детальну інформацію.</p>
                </div>

                <div class="inventory-params" id="inventory-params"></div>

                <button class="inventory-use" id="inventory-use" type="button" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m9 6 9 6-9 6V6Z"></path>
                    </svg>
                    Використати
                </button>
            </aside>
        </div>

        <footer class="inventory-footer">
            <span>ANTARES ROLEPLAY</span>
            <span>ESC — закрити</span>
        </footer>
    </div>
</section>
