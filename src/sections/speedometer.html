<section id="speedometer" aria-hidden="true">
    <div class="speedometer-wrap">
        <div class="speedometer-main">
            <svg class="speedometer-shell" viewBox="0 0 373 74" preserveAspectRatio="none" aria-hidden="true">
                <path class="speedometer-panel-fill" d="M8 68 L29 18 Q34 7 46 7 H360 L342 54 Q337 68 323 68 Z"></path>
                <path class="speedometer-shell-line" d="M8 68 L29 18 Q34 7 46 7 H360 L342 54 Q337 68 323 68 H8 Z"></path>
            </svg>

            <div class="speedometer-speed-block">
                <span id="speedometer-speed-value" class="speedometer-speed speedometer-speed-value">97</span>
                <span id="speedometer-speed-unit" class="speedometer-unit speedometer-speed-unit">km/h</span>
            </div>

            <div class="speedometer-gear-block">
                <span id="speedometer-gear" class="speedometer-gear">3</span>
            </div>

            <div class="speedometer-fuel-block">
                <div class="speedometer-fuel-text speedometer-fuel-top">
                    <svg class="speedometer-fuel-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 21V4.5A1.5 1.5 0 0 1 6.5 3h7A1.5 1.5 0 0 1 15 4.5V21M4 21h12M7 6h6v5H7zM15 8h2l2 2v7.5a1.5 1.5 0 0 0 3 0V9l-2-2"></path>
                    </svg>
                    <span id="speedometer-fuel-current" class="speedometer-fuel-current">65</span>
                    <span class="speedometer-fuel-separator">/</span>
                    <span id="speedometer-fuel-max">80</span>
                    <span class="speedometer-litre">L</span>
                </div>

                <div class="speedometer-fuel-bar" aria-hidden="true">
                    <span id="speedometer-fuel-fill"></span>
                </div>
            </div>
        </div>

        <div class="speedometer-statuses speedometer-indicators" aria-label="Індикатори автомобіля">
            <span id="speedometer-indicator-lights" class="speedometer-status speedometer-indicator" aria-label="Фари">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M15.5 8.5c-4.5.2-7.2 3-7.2 7.5s2.7 7.3 7.2 7.5V8.5Z"></path>
                    <path d="M19 10.5h9M19 16h10M19 21.5h9"></path>
                </svg>
            </span>

            <span id="speedometer-indicator-doors" class="speedometer-status speedometer-indicator" aria-label="Двері">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M6.5 19.5h19l-1.7-5.1a3 3 0 0 0-2.8-2H11a3 3 0 0 0-2.8 2l-1.7 5.1Z"></path>
                    <path d="M5 19.5v5.8c0 1.2 1 2.2 2.2 2.2h1.3v-3h15v3h1.3c1.2 0 2.2-1 2.2-2.2v-5.8M8.5 20.5h3M20.5 20.5h3"></path>
                    <path class="speedometer-lock-open" d="M13 10V8a3 3 0 0 1 5.8-1"></path>
                    <path class="speedometer-lock-closed" d="M13 10V8a3 3 0 0 1 6 0v2"></path>
                </svg>
            </span>

            <span id="speedometer-indicator-engine" class="speedometer-status speedometer-indicator speedometer-status-alert speedometer-indicator-engine" aria-label="Двигун">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M8 12h15l3 3v8h-4l-2.5 3H11l-2-3H5v-8h3v-3ZM12 12V8h7v4M4 12v8M27 14h2v7h-2"></path>
                </svg>
            </span>
        </div>
    </div>
</section>
