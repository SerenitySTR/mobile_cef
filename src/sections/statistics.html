<section id="statistics">
    <div class="statistics-container">
        <img class="statistics-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="statistics-title">
            <span></span>
            <h1>Статистика персонажа</h1>
            <span></span>
        </div>

        <div class="statistics-layout">
            <aside class="statistics-profile">
                <div class="statistics-avatar">
                    <div class="statistics-avatar-glow"></div>

                    <svg viewBox="0 0 200 200" aria-hidden="true">
                        <circle cx="100" cy="66" r="36"></circle>
                        <path d="M44 172c4-42 27-66 56-66s52 24 56 66"></path>
                    </svg>
                </div>

                <div class="statistics-player-name" id="statistics-player-name">Serenity_Walker</div>

                <div class="statistics-online">
                    <i></i>
                    <span id="statistics-online-text">В мережі</span>
                </div>

                <div class="statistics-profile-divider"></div>
                <div class="statistics-profile-list" id="statistics-profile-list"></div>
            </aside>

            <main class="statistics-center">
                <section class="statistics-panel statistics-status-panel">
                    <div class="statistics-section-title">
                        <h2>Стан персонажа</h2>
                        <span></span>
                    </div>

                    <div class="statistics-status-grid" id="statistics-status-grid"></div>
                </section>

                <section class="statistics-panel statistics-main-panel">
                    <div class="statistics-section-title">
                        <h2>Основна статистика</h2>
                        <span></span>
                    </div>

                    <div class="statistics-grid" id="statistics-grid"></div>
                </section>
            </main>

            <aside class="statistics-panel statistics-skills">
                <div class="statistics-section-title">
                    <h2>Навички</h2>
                    <span></span>
                </div>

                <div class="statistics-skills-list" id="statistics-skills-list"></div>

                <div class="statistics-empty" id="statistics-skills-empty">
                    Навички ще не відкриті
                </div>
            </aside>
        </div>

        <button id="statistics-close-button" type="button">Закрити</button>
    </div>
</section>
