<section id="statistics">
    <div class="statistics-background"></div>

    <div class="statistics-container">
        <img class="statistics-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="statistics-title">
            <span></span>
            <h1>Статистика персонажа</h1>
            <span></span>
        </div>

        <div class="statistics-content">
            <aside class="statistics-profile">
                <div class="statistics-avatar">
                    <div class="statistics-avatar-glow"></div>

                    <svg viewBox="0 0 200 200" aria-hidden="true">
                        <circle cx="100" cy="67" r="36"></circle>
                        <path d="M45 172c4-42 26-66 55-66s51 24 55 66"></path>
                        <path d="M65 122c9 15 20 22 35 22s26-7 35-22"></path>
                    </svg>
                </div>

                <div class="statistics-player-name" id="statistics-player-name">Serenity_Walker</div>

                <div class="statistics-online">
                    <i></i>
                    <span id="statistics-online-text">В мережі</span>
                </div>

                <div class="statistics-profile-list" id="statistics-profile-list"></div>
            </aside>

            <main class="statistics-main">
                <div class="statistics-status-grid" id="statistics-status-grid"></div>

                <div class="statistics-experience" id="statistics-experience">
                    <div class="statistics-experience-icon">
                        <span id="statistics-level">12</span>
                    </div>

                    <div class="statistics-experience-content">
                        <div class="statistics-experience-header">
                            <span>Досвід</span>
                            <strong id="statistics-experience-value">2 480 / 4 800 XP</strong>
                        </div>

                        <div class="statistics-progress">
                            <span id="statistics-experience-progress"></span>
                        </div>

                        <div class="statistics-experience-next">
                            До наступного рівня
                            <strong id="statistics-experience-next">2 320 XP</strong>
                        </div>
                    </div>
                </div>

                <div class="statistics-section-title">
                    <h2>Основна статистика</h2>
                    <span></span>
                </div>

                <div class="statistics-grid" id="statistics-grid"></div>
            </main>

            <aside class="statistics-skills">
                <div class="statistics-section-title statistics-section-title-skills">
                    <h2>Навички</h2>
                    <span></span>
                </div>

                <div class="statistics-skills-list" id="statistics-skills-list"></div>

                <div class="statistics-empty" id="statistics-skills-empty">
                    Навички ще не відкриті
                </div>
            </aside>
        </div>

        <button id="statistics-close-button" type="button">Закрити</button>
    </div>
</section>
