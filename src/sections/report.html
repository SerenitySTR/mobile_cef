<section id="report-chat" aria-hidden="true">
    <div class="report-window">
        <header class="report-header"><div><strong>Звернення до адміністрації</strong><small id="report-status">Нове звернення</small></div><button id="report-close-ui" type="button">×</button></header>
        <div id="report-empty" class="report-empty"><h2>Потрібна допомога?</h2><p>Опишіть проблему або питання. Адміністратор відповість у цьому чаті.</p><textarea id="report-create-text" maxlength="500" placeholder="Опишіть ваше звернення..."></textarea><button id="report-create" type="button">Надіслати звернення</button></div>
        <div id="report-active" class="report-active">
            <div id="report-messages" class="report-messages"></div>
            <div class="report-compose"><textarea id="report-message" maxlength="500" placeholder="Написати повідомлення..."></textarea><button id="report-send" type="button">Надіслати</button></div>
            <button id="report-finish" class="report-finish" type="button">Закрити звернення</button>
        </div>
    </div>
</section>
