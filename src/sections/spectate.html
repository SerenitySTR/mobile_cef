<section id="spectate-panel" aria-hidden="true">
    <div class="spectate-shell">
        <div class="spectate-header">
            <div class="spectate-title">
                <span class="spectate-eye" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="2.8"></circle>
                    </svg>
                </span>
                <div>
                    <small>АДМІН-ПАНЕЛЬ</small>
                    <strong>Спостереження</strong>
                </div>
            </div>
            <button id="spectate-close" class="spectate-close" type="button" aria-label="Завершити спостереження">×</button>
        </div>

        <div class="spectate-target">
            <span>Гравець</span>
            <strong id="spectate-name">Невідомо</strong>
        </div>

        <div class="spectate-switcher">
            <button id="spectate-prev" type="button" aria-label="Попередній ID">‹</button>
            <label class="spectate-id-box">
                <span>ID</span>
                <input id="spectate-id" type="number" min="0" step="1" inputmode="numeric" value="0">
            </label>
            <button id="spectate-next" type="button" aria-label="Наступний ID">›</button>
        </div>

        <button id="spectate-refresh" class="spectate-refresh" type="button">
            <span class="spectate-refresh-icon">↻</span>
            <span>Оновити стеження</span>
        </button>
    </div>
</section>
