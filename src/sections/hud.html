<section id="hud">
    <div class="hud-container">
        <div class="hud-top">
            <img class="hud-logo" src="./assets/CSS/Images/Hud/logo.svg" alt="">
            <div class="hud-weapon">
                <img id="hud-weapon-icon" src="./assets/CSS/Images/Hud/Weapons/fist.svg" alt="">
                <span id="hud-weapon-ammo"></span>
            </div>
        </div>

        <div class="hud-money">
            <img src="./assets/CSS/Images/Hud/icon-money.svg" alt="">
            <span id="hud-money-value">$25 000</span>
        </div>

        <div class="hud-stats">
            <div class="hud-stat hud-health">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-health.svg" alt="">
                <div class="hud-stat-bar"><div class="hud-stat-fill" id="hud-health-bar"></div></div>
                <span id="hud-health-value">100 / 100</span>
            </div>

            <div class="hud-stat hud-armour">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-armour.svg" alt="">
                <div class="hud-stat-bar"><div class="hud-stat-fill" id="hud-armour-bar"></div></div>
                <span id="hud-armour-value">60 / 100</span>
            </div>

            <div class="hud-stat hud-hunger">
                <img class="hud-stat-icon" src="./assets/CSS/Images/Hud/icon-hunger.svg" alt="">
                <div class="hud-stat-bar"><div class="hud-stat-fill" id="hud-hunger-bar"></div></div>
                <span id="hud-hunger-value">75 / 100</span>
            </div>
        </div>
    </div>
</section>
