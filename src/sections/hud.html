<section id="hud">
    <div class="hud-container">
        <div class="hud-header">
            <img class="hud-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

            <div class="hud-money">
                <span class="hud-money-icon">$</span>
                <span id="hud-money-value">$25 000</span>
            </div>
        </div>

        <div class="hud-stats">
            <div class="hud-stat hud-health">
                <div class="hud-stat-icon">♥</div>

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-health-bar"></div>
                </div>

                <span id="hud-health-value">100</span>
            </div>

            <div class="hud-stat hud-armour">
                <div class="hud-stat-icon">◆</div>

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-armour-bar"></div>
                </div>

                <span id="hud-armour-value">60</span>
            </div>

            <div class="hud-stat hud-hunger">
                <div class="hud-stat-icon">●</div>

                <div class="hud-stat-bar">
                    <div class="hud-stat-fill" id="hud-hunger-bar"></div>
                </div>

                <span id="hud-hunger-value">75</span>
            </div>
        </div>
    </div>
</section>
