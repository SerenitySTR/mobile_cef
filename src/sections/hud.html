<section id="hud">
  <div class="hud-main-shell">
    <div class="hud-logo-panel">
    </div>

    <div class="hud-main-panel">
    <div class="hud-top-spacer" aria-hidden="true"></div>
    <div class="hud-stats">
      <div class="hud-stat hud-health">
        <svg class="hud-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="hud-ring-track" cx="60" cy="60" r="49"></circle>
          <circle id="hud-health-ring" class="hud-ring-progress" cx="60" cy="60" r="49"></circle>
        </svg>
        <div class="hud-stat-core">
          <svg class="hud-stat-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 54S11 42 11 24c0-7.6 5.1-13 12.1-13 5 0 8.1 2.8 8.9 6 1.2-3.2 4.2-6 9.2-6C48 11 53 16.4 53 24c0 18-21 30-21 30Z"></path>
          </svg>
          <span id="hud-health-value" class="hud-stat-value">100</span>
        </div>
      </div>

      <div class="hud-stat hud-armour">
        <svg class="hud-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="hud-ring-track" cx="60" cy="60" r="49"></circle>
          <circle id="hud-armour-ring" class="hud-ring-progress" cx="60" cy="60" r="49"></circle>
        </svg>
        <div class="hud-stat-core">
          <svg class="hud-stat-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 7 49 14v14c0 12.5-7.7 21-17 28-9.3-7-17-15.5-17-28V14L32 7Z"></path>
          </svg>
          <span id="hud-armour-value" class="hud-stat-value">100</span>
        </div>
      </div>

      <div class="hud-stat hud-hunger">
        <svg class="hud-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="hud-ring-track" cx="60" cy="60" r="49"></circle>
          <circle id="hud-hunger-ring" class="hud-ring-progress" cx="60" cy="60" r="49"></circle>
        </svg>
        <div class="hud-stat-core">
          <svg class="hud-stat-icon hud-burger-icon" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M11 25C12.7 15.6 20.2 10 32 10s19.3 5.6 21 15H11Z"></path>
            <circle cx="22" cy="18" r="1.3"></circle><circle cx="31" cy="15" r="1.3"></circle><circle cx="40" cy="19" r="1.3"></circle>
            <path d="M10 29h44v5H10z"></path>
            <path d="M13 37c4-3.2 7.8-3.2 11.8 0 4-3.2 7.9-3.2 11.9 0 4-3.2 7.8-3.2 11.8 0l-3 4H16l-3-4Z"></path>
            <path d="M14 43h36l-3.8 7H17.8L14 43Z"></path>
            <path d="M12 53h40c-1.5 4-5 6-10 6H22c-5 0-8.5-2-10-6Z"></path>
          </svg>
          <span id="hud-hunger-value" class="hud-stat-value">100</span>
        </div>
      </div>
    </div>

    <div class="hud-separator"></div>

    <div class="hud-weapon">
      <div class="hud-weapon-icon">
        <img id="hud-weapon-image" src="./assets/CSS/Images/Hud/Weapons/fist.webp" alt="" />
      </div>
      <div class="hud-ammo">
        <span id="hud-ammo-clip" class="hud-ammo-clip">0</span>
        <span id="hud-ammo-total" class="hud-ammo-total">/0</span>
      </div>
    </div>
    </div>
  </div>

  <div class="hud-money-row-spacer" aria-hidden="true"></div>

  <div class="hud-bottom-panel">
    <div class="hud-money">
      <div class="hud-money-icon">$</div>
      <span id="hud-money-value">0</span>
    </div>
    <div id="hud-wanted" class="hud-wanted" aria-label="Wanted level"></div>
  </div>
</section>

<div id="hud-corner-info">
  <div class="hud-corner-logo"><img src="./assets/CSS/Images/Hud/logo.svg" alt="Antares" /></div>
  <div class="hud-corner-divider"></div>
  <div class="hud-corner-player">
    <strong id="hud-player-name">Nastya Petrova</strong>
    <div class="hud-corner-idtext">ID: <span id="hud-id-value">0</span></div>
  </div>
  <div class="hud-corner-divider hud-corner-divider-second"></div>
  <div class="hud-corner-datetime">
    <div class="hud-corner-time"><span class="hud-clock-icon"></span><span id="hud-time-value">22:31</span></div>
    <div class="hud-corner-date"><span class="hud-calendar-icon"></span><span id="hud-date-value">14.09.2025</span></div>
  </div>
</div>
