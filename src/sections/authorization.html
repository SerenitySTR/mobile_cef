<section id="authorization">
    <div class="authorization-background"></div>

    <div class="authorization-container">
        <img class="authorization-logo" src="./assets/CSS/Images/Registration/logo.svg" alt="Antares RolePlay">

        <div class="authorization-title">
            <span></span>
            <h1>Авторизація</h1>
            <span></span>
        </div>

        <div class="authorization-field">
            <img src="./assets/CSS/Images/Registration/icon-user.svg" alt="">
            <input type="text" id="authorization-username" placeholder="Ім'я користувача" readonly>
        </div>

        <div class="authorization-field">
            <img src="./assets/CSS/Images/Registration/icon-lock.svg" alt="">
            <input type="password" id="authorization-password" placeholder="Введіть пароль" autocomplete="off">

            <button class="authorization-password-eye" type="button">
                <img src="./assets/CSS/Images/Registration/icon-eye.svg" alt="">
            </button>
        </div>

        <button id="authorization-button" type="button">Увійти</button>
    </div>
</section>
